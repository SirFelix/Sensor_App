[package]
name = "sensor_plotter"
version = "1.0.0"
edition = "2024"
description = "Live sensor plotter: NI-DAQmx, serial/RS485, Modbus; scaling, recording and review"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
dirs = "7.0.0"
eframe = { version = "0.37", default-features = false, features = ["persistence", "glow", "wgpu", "default_fonts", "clipboard"] }
egui = "0.37.0"
egui_plot = "0.38.0"
libloading = "0.9.0"
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serialport = "4.10.1"

[profile.release]
opt-level = 3
lto = "thin"
